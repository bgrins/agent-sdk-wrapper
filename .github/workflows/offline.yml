name: Offline validation

on:
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    name: Python offline
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      UV_PYTHON: "3.12"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.13"
          enable-cache: false
      - run: uv python install 3.12
      - run: uv --directory packages/python sync --locked --extra dev
      - run: uv --directory packages/python run --locked pytest -q -m 'not integration'
      - run: uv --directory packages/python run --locked ruff check

  typescript:
    name: TypeScript offline
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.23.2"
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run verify

  gvisor:
    name: gVisor offline
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      UV_PYTHON: "3.12"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.23.2"
          package-manager-cache: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.13"
          enable-cache: false
      - run: uv python install 3.12
      - run: uv --directory packages/python sync --locked --extra dev
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: bash examples/gvisor/infra/install-runsc.sh
      - run: bash examples/gvisor/scripts/build.sh
      - run: bash examples/gvisor/scripts/test.sh
