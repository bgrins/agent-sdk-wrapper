<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>agent-sdk-wrapper remote control</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #ffffff;
    --panel: #f5f5f5;
    --panel-2: #fafafa;
    --border: #e6e6e6;
    --text: #1e1e1e;
    --muted: #7f7f7f;
    --accent: #0d99ff;
    --accent-tint: rgba(13, 153, 255, .10);
    --green: #14ae5c;
    --green-tint: rgba(20, 174, 92, .10);
    --amber: #ffa629;
    --amber-tint: rgba(255, 166, 41, .12);
    --red: #f24822;
    --red-tint: rgba(242, 72, 34, .10);
    --shadow: 0 1px 3px rgba(0,0,0,.08);
    --sans: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1e1e1e;
      --panel: #2c2c2c;
      --panel-2: #262626;
      --border: #444444;
      --text: #ffffff;
      --muted: #9b9b9b;
      --accent: #0c8ce9;
      --accent-tint: rgba(12, 140, 233, .16);
      --green-tint: rgba(20, 174, 92, .16);
      --amber-tint: rgba(255, 166, 41, .16);
      --red-tint: rgba(242, 72, 34, .16);
      --shadow: 0 1px 3px rgba(0,0,0,.4);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; height: 100vh; display: grid; grid-template-columns: 280px 1fr;
    font-family: var(--sans); font-size: 12px; color: var(--text); background: var(--bg);
  }
  body.sidebar-collapsed { grid-template-columns: 0 1fr; }
  body.sidebar-collapsed #sidebar { display: none; }
  button {
    font: inherit; padding: 5px 12px; cursor: pointer; border-radius: 6px;
    border: 1px solid var(--border); background: var(--bg); color: var(--text);
  }
  button:hover:not(:disabled) { background: var(--panel); }
  button:disabled { opacity: .4; cursor: default; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.primary:hover:not(:disabled) { background: var(--accent); filter: brightness(1.08); }
  button.icon { padding: 4px 8px; font-size: 13px; line-height: 1; border: none; color: var(--muted); }
  button.icon:hover { color: var(--text); }
  input, select {
    width: 100%; font: inherit; padding: 6px 8px; border-radius: 6px;
    border: 1px solid var(--border); background: var(--bg); color: var(--text);
  }
  input:focus, select:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: transparent; }
  ::placeholder { color: var(--muted); }

  /* ---------- sidebar ---------- */
  #sidebar {
    grid-column: 1; height: 100vh; display: flex; flex-direction: column; min-height: 0;
    border-right: 1px solid var(--border); background: var(--panel-2);
  }
  #sidebar-head {
    flex: none; display: flex; align-items: center; gap: 8px;
    padding: 12px 8px 12px 14px; border-bottom: 1px solid var(--border);
  }
  #sidebar-head .logo { font-weight: 600; font-size: 13px; letter-spacing: -.01em; }
  #sidebar-head .logo::before { content: "⌁ "; color: var(--accent); }
  #collapse { margin-left: auto; }
  #new-session { flex: none; border-bottom: 1px solid var(--border); padding: 6px 14px 0; }
  #new-session summary {
    cursor: pointer; list-style: none; display: flex; align-items: center;
    font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: .04em;
    color: var(--muted); padding: 8px 0;
  }
  #new-session summary::after { content: "+"; margin-left: auto; font-size: 14px; }
  #new-session[open] summary::after { content: "–"; }
  #new-session .form { padding-bottom: 14px; }
  label { display: block; font-size: 11px; margin: 10px 0 4px; color: var(--muted); }
  #create { margin-top: 14px; width: 100%; }
  #sessions-title {
    flex: none; font-weight: 600; font-size: 11px; text-transform: uppercase;
    letter-spacing: .04em; color: var(--muted); padding: 12px 14px 6px;
  }
  #sessions { flex: 1; min-height: 0; overflow-y: auto; padding: 0 8px 12px; }
  .session {
    display: flex; align-items: center; gap: 10px; padding: 8px 10px;
    border-radius: 6px; margin-bottom: 2px; cursor: pointer;
  }
  .session:hover { background: var(--panel); }
  .session.active { background: var(--accent-tint); }
  .session.active .title { color: var(--accent); }
  .session .meta { min-width: 0; }
  .session .title { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .session .sub { font-size: 10.5px; color: var(--muted); font-family: var(--mono); }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; background: var(--muted); }
  .dot.idle { background: var(--green); }
  .dot.running { background: var(--amber); animation: pulse 1.2s infinite; }
  .dot.awaiting_permission { background: var(--red); animation: pulse .6s infinite; }
  .dot.closed { background: var(--border); }
  @keyframes pulse { 50% { opacity: .35; } }
  #sessions .empty { color: var(--muted); padding: 8px 10px; }

  /* ---------- main / status bar ---------- */
  /* Explicit column: with the sidebar display:none, auto-placement would drop
     #main into the collapsed 0px first column. */
  #main { grid-column: 2; display: flex; flex-direction: column; min-width: 0; height: 100vh; }
  #statusbar {
    flex: none; padding: 8px 14px; border-bottom: 1px solid var(--border);
    display: flex; gap: 12px; align-items: center; background: var(--bg);
  }
  #expand { display: none; }
  body.sidebar-collapsed #expand { display: inline-flex; }
  #sess-label { font-weight: 600; font-family: var(--mono); font-size: 12px; }
  .chip {
    padding: 2px 10px; border-radius: 999px; font-size: 11px; font-weight: 500;
    background: var(--panel); color: var(--muted);
  }
  .chip.idle { background: var(--green-tint); color: var(--green); }
  .chip.running { background: var(--amber-tint); color: var(--amber); }
  .chip.awaiting_permission { background: var(--red-tint); color: var(--red); }
  #native-id { color: var(--muted); cursor: copy; font-family: var(--mono); font-size: 11px; }
  #native-id:hover { color: var(--accent); }
  #usage-total { color: var(--muted); margin-left: auto; font-size: 11px; }

  /* ---------- transcript ---------- */
  #log { flex: 1; min-height: 0; overflow-y: auto; padding: 18px 20px; background: var(--panel-2); }
  #log > .hint { color: var(--muted); padding: 40px; text-align: center; }
  .row { max-width: 860px; margin: 12px auto; }
  .who { font-size: 10.5px; color: var(--muted); margin: 0 4px 3px; }
  .bubble {
    padding: 9px 13px; border-radius: 10px; font-size: 13px; line-height: 1.45;
    white-space: pre-wrap; word-break: break-word; box-shadow: var(--shadow);
  }
  .user .who { text-align: right; }
  .user .bubble { background: var(--accent-tint); margin-left: 18%; border-top-right-radius: 3px; }
  .assistant .bubble { background: var(--bg); margin-right: 18%; border: 1px solid var(--border); border-top-left-radius: 3px; }

  details.thinking { font-size: 12px; color: var(--muted); }
  details.thinking summary { cursor: pointer; list-style: none; }
  details.thinking summary::before { content: "▸ "; }
  details.thinking[open] summary::before { content: "▾ "; }
  details.thinking summary:hover { color: var(--text); }
  details.thinking .bubble {
    background: var(--panel); box-shadow: none; margin: 6px 0 0; font-style: italic;
  }

  .tool {
    border: 1px solid var(--border); border-radius: 8px; overflow: hidden;
    background: var(--bg); box-shadow: var(--shadow); font-size: 12px;
  }
  .tool > .head { padding: 7px 12px; display: flex; gap: 10px; align-items: center; }
  .tool .name { font-weight: 600; flex: none; }
  .tool .name::before { content: "⚙ "; color: var(--muted); }
  .tool .summary {
    color: var(--muted); font-family: var(--mono); font-size: 11.5px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .tool .status {
    margin-left: auto; flex: none; font-size: 10.5px; font-weight: 500;
    padding: 1px 8px; border-radius: 999px; background: var(--amber-tint); color: var(--amber);
  }
  .tool .status.done { background: var(--green-tint); color: var(--green); }
  .tool .status.error { background: var(--red-tint); color: var(--red); }
  .tool .body {
    padding: 8px 12px; white-space: pre-wrap; word-break: break-word;
    max-height: 220px; overflow-y: auto; font-family: var(--mono); font-size: 11.5px;
    border-top: 1px solid var(--border); background: var(--panel-2); color: var(--muted);
  }
  .tool.error { border-color: var(--red); }

  .perm {
    border: 1px solid var(--amber); border-radius: 8px; padding: 12px 14px;
    background: var(--amber-tint); box-shadow: var(--shadow);
  }
  .perm .title { font-weight: 600; margin-bottom: 6px; }
  .perm .title::before { content: "⚠ "; }
  .perm pre {
    margin: 8px 0; padding: 8px 10px; background: var(--bg); border: 1px solid var(--border);
    border-radius: 6px; white-space: pre-wrap; word-break: break-word;
    max-height: 160px; overflow-y: auto; font-family: var(--mono); font-size: 11.5px;
  }
  .perm .actions { display: flex; gap: 8px; }
  .perm .actions button.deny { color: var(--red); }
  .perm .resolution { font-weight: 600; }
  .perm .resolution.allow { color: var(--green); } .perm .resolution.deny { color: var(--red); }

  .errcard {
    background: var(--red-tint); border: 1px solid var(--red); border-radius: 8px;
    padding: 9px 13px; white-space: pre-wrap; word-break: break-word;
  }
  .divider { text-align: center; font-size: 10.5px; color: var(--muted); margin: 16px auto; }

  /* ---------- banner + composer ---------- */
  #perm-banner {
    display: none; flex: none; padding: 8px 16px; cursor: pointer; font-weight: 500;
    background: var(--amber-tint); border-top: 1px solid var(--amber); color: var(--text);
  }
  #perm-banner.visible { display: block; }
  #perm-banner:hover { filter: brightness(1.03); }
  #composer {
    flex: none; display: flex; gap: 10px; padding: 12px 16px;
    border-top: 1px solid var(--border); background: var(--bg);
  }
  #composer input { flex: 1; padding: 9px 12px; border-radius: 8px; font-size: 13px; }
</style>
</head>
<body>
<div id="sidebar">
  <div id="sidebar-head">
    <span class="logo">remote control</span>
    <button class="icon" id="collapse" title="Collapse sidebar">&#171;</button>
  </div>
  <details id="new-session" open>
    <summary>New session</summary>
    <div class="form">
      <label>provider</label>
      <select id="provider">
        <option value="anthropic">anthropic (claude)</option>
        <option value="openai">openai (codex)</option>
      </select>
      <label>model</label>
      <select id="model-select"></select>
      <input id="model-custom" placeholder="model id" hidden style="margin-top:6px">
      <label>cwd</label>
      <input id="cwd" placeholder="server cwd">
      <label>resume native session/thread id</label>
      <input id="resume" placeholder="start fresh">
      <label>permission mode</label>
      <input id="permission_mode" placeholder="default · untrusted · bypassPermissions">
      <button id="create" class="primary">Start session</button>
    </div>
  </details>
  <div id="sessions-title">Sessions</div>
  <div id="sessions"><div class="empty">none yet</div></div>
</div>
<div id="main">
  <div id="statusbar">
    <button class="icon" id="expand" title="Expand sidebar">&#187;</button>
    <span id="sess-label">no session selected</span>
    <span id="sess-state" class="chip" hidden></span>
    <span id="native-id" title="native session/thread id — click to copy" hidden></span>
    <span id="usage-total" hidden></span>
    <button id="interrupt" disabled>Interrupt</button>
    <button id="close-session" disabled>Close</button>
  </div>
  <div id="log"><div class="hint">select or start a session</div></div>
  <div id="perm-banner">&#9888; Permission required — click to jump to the request</div>
  <div id="composer">
    <input type="text" id="input" placeholder="send a message" disabled>
    <button id="send" class="primary" disabled>Send</button>
  </div>
</div>
<script>
const $ = (id) => document.getElementById(id);
let current = null;          // selected session id
let source = null;           // EventSource for current session
let toolCards = new Map();   // tool_use id -> card element
let permCards = new Map();   // request_id -> card element
let usageTotals = { tokens: 0, cost: 0 };

async function api(path, opts) {
  const res = await fetch(path, opts);
  const body = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(body.error || res.statusText);
  return body;
}

/* ---------- new session: model presets + last-used memory ---------- */

const MODEL_PRESETS = {
  anthropic: ['claude-sonnet-5', 'claude-haiku-4-5', 'claude-opus-4-7'],
  openai: ['gpt-5.5', 'gpt-5'],
};
const CUSTOM = '__custom';

function lastModel(provider) {
  // null = nothing remembered; '' = user explicitly chose "provider default"
  try { return localStorage.getItem('last-model:' + provider); } catch { return null; }
}

function rememberModel(provider, model) {
  try { localStorage.setItem('last-model:' + provider, model || ''); } catch {}
}

function populateModels() {
  const provider = $('provider').value;
  const select = $('model-select');
  const presets = [...(MODEL_PRESETS[provider] || [])];
  const remembered = lastModel(provider);
  if (remembered && remembered !== CUSTOM && !presets.includes(remembered)) {
    presets.unshift(remembered);
  }
  select.innerHTML = '';
  for (const [value, label] of [
    ...presets.map(m => [m, m]),
    ['', 'provider default'],
    [CUSTOM, 'custom…'],
  ]) {
    const opt = document.createElement('option');
    opt.value = value;
    opt.textContent = label;
    select.appendChild(opt);
  }
  if (remembered !== null && [...select.options].some(o => o.value === remembered)) {
    select.value = remembered;
  } else {
    select.value = presets[0] ?? '';
  }
  $('model-custom').hidden = select.value !== CUSTOM;
}

function selectedModel() {
  const value = $('model-select').value;
  return value === CUSTOM ? $('model-custom').value.trim() : value;
}

$('provider').onchange = populateModels;
$('model-select').onchange = () => {
  $('model-custom').hidden = $('model-select').value !== CUSTOM;
  if (!$('model-custom').hidden) $('model-custom').focus();
};
populateModels();

/* ---------- sidebar collapse ---------- */

function setCollapsed(collapsed) {
  document.body.classList.toggle('sidebar-collapsed', collapsed);
  try { localStorage.setItem('sidebar-collapsed', collapsed ? '1' : ''); } catch {}
}
$('collapse').onclick = () => setCollapsed(true);
$('expand').onclick = () => setCollapsed(false);
try { if (localStorage.getItem('sidebar-collapsed')) setCollapsed(true); } catch {}

/* ---------- sidebar sessions (keyed, in-place updates) ---------- */

async function refreshSessions() {
  let sessions;
  try { ({ sessions } = await api('/api/sessions')); } catch { return; }
  const box = $('sessions');
  const empty = box.querySelector('.empty');
  if (empty) empty.style.display = sessions.length ? 'none' : '';
  const seen = new Set();
  for (const s of sessions) {
    seen.add(s.session_id);
    let el = box.querySelector(`[data-id="${s.session_id}"]`);
    if (!el) {
      el = document.createElement('div');
      el.className = 'session';
      el.dataset.id = s.session_id;
      el.innerHTML = '<span class="dot"></span><span class="meta"><div class="title"></div><div class="sub"></div></span>';
      el.onclick = () => select(s.session_id);
      box.appendChild(el);
    }
    el.classList.toggle('active', s.session_id === current);
    el.querySelector('.dot').className = 'dot ' + s.state;
    el.querySelector('.title').textContent = `${s.provider}${s.model ? ' · ' + s.model : ''}`;
    el.querySelector('.sub').textContent = `${s.session_id} · ${s.state}`;
  }
  for (const el of [...box.querySelectorAll('.session')]) {
    if (!seen.has(el.dataset.id)) el.remove();
  }
}

/* ---------- status bar ---------- */

function setState(state) {
  const chip = $('sess-state');
  chip.hidden = !state;
  chip.textContent = state ? state.replace('_', ' ') : '';
  chip.className = 'chip ' + (state || '');
  const usable = current && state && state !== 'closed';
  $('input').disabled = !usable;
  $('send').disabled = !usable;
  $('interrupt').disabled = !(usable && (state === 'running' || state === 'awaiting_permission'));
  $('close-session').disabled = !current || state === 'closed';
  $('input').placeholder =
    state === 'running' ? 'agent is working — sending will steer the current turn'
    : state === 'awaiting_permission' ? 'a permission request is waiting above'
    : 'send a message';
  $('perm-banner').classList.toggle('visible', state === 'awaiting_permission');
}

function setNativeId(id) {
  const el = $('native-id');
  el.hidden = !id;
  el.textContent = id || '';
  el.onclick = () => navigator.clipboard.writeText(id);
}

function addUsage(u) {
  usageTotals.tokens += (u.usage && u.usage.total_tokens) || 0;
  usageTotals.cost += u.cost_usd || 0;
  const el = $('usage-total');
  el.hidden = false;
  el.textContent = `${usageTotals.tokens.toLocaleString()} tok` +
    (usageTotals.cost ? ` · $${usageTotals.cost.toFixed(4)}` : '');
}

/* ---------- transcript rendering ---------- */

function row(cls) {
  const div = document.createElement('div');
  div.className = 'row ' + cls;
  return div;
}

function bubbleRow(cls, who, text) {
  const div = row(cls);
  div.innerHTML = '<div class="who"></div><div class="bubble"></div>';
  div.querySelector('.who').textContent = who;
  div.querySelector('.bubble').textContent = text;
  return div;
}

function toolSummary(input) {
  if (!input) return '';
  return input.command || input.file_path || input.path || input.url ||
    JSON.stringify(input);
}

function render(entry, sid) {
  if (sid !== current) return;
  const e = entry.event;
  const log = $('log');
  const pinned = log.scrollHeight - log.scrollTop - log.clientHeight < 60;
  let el = null;

  if (e.type === 'user_message') {
    el = bubbleRow('user', e.steered ? 'you (steered mid-turn)' : 'you', e.text);
  } else if (e.type === 'text') {
    el = bubbleRow('assistant', 'agent', e.text);
  } else if (e.type === 'thinking') {
    el = row('');
    const d = document.createElement('details');
    d.className = 'thinking';
    const preview = e.text.replace(/\s+/g, ' ').slice(0, 90);
    d.innerHTML = '<summary></summary><div class="bubble"></div>';
    d.querySelector('summary').textContent = `thinking — ${preview}…`;
    d.querySelector('.bubble').textContent = e.text;
    el.appendChild(d);
  } else if (e.type === 'tool_call') {
    el = row('');
    const card = document.createElement('div');
    card.className = 'tool';
    card.innerHTML = '<div class="head"><span class="name"></span><span class="summary"></span><span class="status">running</span></div>';
    card.querySelector('.name').textContent = e.name || 'tool';
    card.querySelector('.summary').textContent = toolSummary(e.input);
    el.appendChild(card);
    if (e.id) toolCards.set(e.id, card);
  } else if (e.type === 'tool_result') {
    const card = e.id && toolCards.get(e.id);
    const output = e.output || '(no output)';
    if (card) {
      card.classList.toggle('error', !!e.is_error);
      const status = card.querySelector('.status');
      status.textContent = e.is_error ? 'error' : 'done';
      status.className = 'status ' + (e.is_error ? 'error' : 'done');
      const body = document.createElement('div');
      body.className = 'body';
      body.textContent = output;
      card.appendChild(body);
    } else {
      el = row('');
      const orphan = document.createElement('div');
      orphan.className = 'tool' + (e.is_error ? ' error' : '');
      orphan.innerHTML = '<div class="head"><span class="name">tool result</span></div><div class="body"></div>';
      orphan.querySelector('.body').textContent = output;
      el.appendChild(orphan);
    }
  } else if (e.type === 'permission_request') {
    el = row('');
    const card = document.createElement('div');
    card.className = 'perm';
    card.dataset.requestId = e.request_id;
    card.innerHTML = '<div class="title"></div><pre></pre><div class="actions"></div>';
    card.querySelector('.title').textContent =
      e.title || `${e.tool || 'tool'} requests permission`;
    card.querySelector('pre').textContent = JSON.stringify(e.input || {}, null, 1);
    const actions = card.querySelector('.actions');
    for (const behavior of ['allow', 'deny']) {
      const btn = document.createElement('button');
      btn.textContent = behavior === 'allow' ? 'Allow' : 'Deny';
      btn.className = behavior === 'allow' ? 'primary' : 'deny';
      btn.onclick = async () => {
        actions.querySelectorAll('button').forEach(b => b.disabled = true);
        await api(`/api/sessions/${sid}/permissions/${e.request_id}`, {
          method: 'POST', headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ behavior }),
        }).catch(err => {
          alert(err.message);
          actions.querySelectorAll('button').forEach(b => b.disabled = false);
        });
      };
      actions.appendChild(btn);
    }
    el.appendChild(card);
    permCards.set(e.request_id, card);
  } else if (e.type === 'permission_resolved') {
    const card = permCards.get(e.request_id);
    if (card) {
      const actions = card.querySelector('.actions');
      actions.innerHTML = `<span class="resolution ${e.behavior}"></span>`;
      actions.querySelector('.resolution').textContent =
        e.behavior === 'allow' ? '✓ allowed' : `✗ denied${e.message ? ' — ' + e.message : ''}`;
    }
  } else if (e.type === 'error') {
    el = row('');
    const card = document.createElement('div');
    card.className = 'errcard';
    card.textContent = `error${e.error_type ? ' (' + e.error_type + ')' : ''}: ${e.message}`;
    el.appendChild(card);
  } else if (e.type === 'state_changed') {
    setState(e.state);
    refreshSessions();
    if (e.state === 'closed') {
      el = row('divider');
      el.textContent = '— session closed —';
      if (source && sid === current) source.close();
    }
  } else if (e.type === 'session_info') {
    setNativeId(e.id);
  } else if (e.type === 'usage') {
    addUsage(e);
  } else if (e.type === 'warning') {
    el = row('divider');
    el.textContent = `warning: ${e.message}`;
  }

  if (el) {
    log.appendChild(el);
    if (pinned) log.scrollTop = log.scrollHeight;
  }
}

$('perm-banner').onclick = () => {
  const cards = [...document.querySelectorAll('.perm')];
  const target = cards.reverse().find(c => c.querySelector('.actions button'));
  if (target) target.scrollIntoView({ behavior: 'smooth', block: 'center' });
};

/* ---------- session selection / actions ---------- */

function resetTranscript() {
  $('log').innerHTML = '';
  toolCards = new Map();
  permCards = new Map();
  usageTotals = { tokens: 0, cost: 0 };
  $('usage-total').hidden = true;
  setNativeId(null);
}

function select(id) {
  current = id;
  resetTranscript();
  $('sess-label').textContent = id;
  if (source) source.close();
  source = new EventSource(`/api/sessions/${id}/events`);
  source.onmessage = (msg) => render(JSON.parse(msg.data), id);
  source.onerror = () => {
    // EventSource auto-reconnects on transient errors; only treat a hard
    // close as terminal, and stop reconnecting to deleted sessions.
    if (source.readyState === EventSource.CLOSED) {
      setState('closed');
    } else {
      api(`/api/sessions/${id}`).then(s => setState(s.state)).catch(() => {
        source.close();
        setState('closed');
      });
    }
  };
  api(`/api/sessions/${id}`).then(s => {
    setState(s.state);
    setNativeId(s.native_session_id);
  });
  refreshSessions();
}

$('create').onclick = async () => {
  const body = { provider: $('provider').value };
  const model = selectedModel();
  if (model) body.model = model;
  for (const k of ['cwd', 'resume', 'permission_mode']) {
    if ($(k).value.trim()) body[k] = $(k).value.trim();
  }
  $('create').disabled = true;
  $('create').textContent = 'Starting…';
  try {
    const s = await api('/api/sessions', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(body),
    });
    rememberModel(body.provider, model);
    populateModels();
    await refreshSessions();
    select(s.session_id);
  } catch (err) { alert(err.message); }
  $('create').disabled = false;
  $('create').textContent = 'Start session';
};

async function send() {
  const text = $('input').value.trim();
  if (!text || !current) return;
  $('input').value = '';
  await api(`/api/sessions/${current}/messages`, {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ text }),
  }).catch(err => alert(err.message));
}
$('send').onclick = send;
$('input').addEventListener('keydown', (e) => { if (e.key === 'Enter') send(); });

$('interrupt').onclick = () =>
  api(`/api/sessions/${current}/interrupt`, { method: 'POST' }).catch(err => alert(err.message));

$('close-session').onclick = async () => {
  await api(`/api/sessions/${current}`, { method: 'DELETE' }).catch(err => alert(err.message));
  if (source) source.close();
  current = null;
  $('sess-label').textContent = 'no session selected';
  setState(null);
  resetTranscript();
  $('log').innerHTML = '<div class="hint">select or start a session</div>';
  refreshSessions();
};

refreshSessions();
setInterval(refreshSessions, 10000);
</script>
</body>
