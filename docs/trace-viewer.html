<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Fallback for file:// use. The trace server also sends a hash-based policy. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'none'">
  <title>agent-sdk-wrapper Trace Viewer</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f7f8fa;
      --panel: #ffffff;
      --text: #1f2937;
      --muted: #667085;
      --border: #d9dee7;
      --accent: #0969da;
      --ok: #16794c;
      --warn: #9a6700;
      --err: #b42318;
      --tool: #6f42c1;
      --code: #f3f4f6;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 14px/1.45 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    header {
      border-bottom: 1px solid var(--border);
      background: var(--panel);
    }

    .wrap {
      width: min(1180px, calc(100vw - 32px));
      margin: 0 auto;
    }

    .top {
      display: flex;
      gap: 16px;
      align-items: center;
      justify-content: space-between;
      padding: 16px 0;
    }

    h1 {
      margin: 0;
      font-size: 20px;
      line-height: 1.2;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      justify-content: flex-end;
    }

    [hidden] {
      display: none !important;
    }

    label.button,
    button.button {
      display: inline-flex;
      align-items: center;
      min-height: 34px;
      padding: 0 12px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: #fdfdfd;
      cursor: pointer;
      color: var(--text);
      font: inherit;
      font-weight: 600;
    }

    label.button:focus-within,
    label.button:hover,
    button.button:focus-visible,
    button.button:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    input[type="file"] {
      position: absolute;
      inline-size: 1px;
      block-size: 1px;
      opacity: 0;
      pointer-events: none;
    }

    main {
      padding: 20px 0 40px;
    }

    .viewer-layout {
      display: grid;
      grid-template-columns: minmax(280px, 340px) minmax(0, 1fr);
      gap: 16px;
      align-items: start;
    }

    body.results-collapsed .viewer-layout {
      grid-template-columns: minmax(0, 1fr);
    }

    .trace-workspace {
      min-width: 0;
    }

    section {
      margin: 0 0 16px;
      padding: 16px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--panel);
    }

    h2 {
      margin: 0 0 12px;
      font-size: 15px;
    }

    .section-head {
      display: flex;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .section-head h2 {
      margin: 0;
    }

    .summary {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 10px;
    }

    .metric {
      min-width: 0;
    }

    .metric .label {
      color: var(--muted);
      font-size: 12px;
    }

    .metric .value {
      overflow-wrap: anywhere;
      font-weight: 600;
    }

    .status-success {
      color: var(--ok);
    }

    .status-failure,
    .status-timeout,
    .status-cancelled {
      color: var(--err);
    }

    .grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(240px, 320px);
      gap: 16px;
      align-items: start;
    }

    .timeline {
      display: grid;
      gap: 8px;
    }

    .results-sidebar {
      position: sticky;
      top: 16px;
      display: flex;
      overflow: hidden;
      max-height: calc(100vh - 32px);
      min-height: 360px;
      flex-direction: column;
      padding: 16px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--panel);
    }

    body.results-collapsed .results-sidebar {
      display: none;
    }

    .results-scroll {
      overflow: auto;
      min-height: 0;
      padding-right: 2px;
    }

    .results-status {
      margin-bottom: 10px;
      color: var(--muted);
    }

    .run-list {
      display: grid;
      grid-template-columns: 1fr;
      gap: 8px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .run-button {
      width: 100%;
      min-height: 0;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-left: 4px solid #98a2b3;
      border-radius: 6px;
      background: #ffffff;
      color: var(--text);
      cursor: pointer;
      font: inherit;
      text-align: left;
    }

    .run-button:hover,
    .run-button:focus-visible {
      border-color: var(--accent);
      outline: none;
    }

    .run-button[aria-current="true"] {
      border-color: var(--accent);
      border-left-color: var(--accent);
      background: #f5faff;
    }

    .run-button.status-success {
      border-left-color: var(--ok);
    }

    .run-button.status-failure,
    .run-button.status-timeout,
    .run-button.status-cancelled {
      border-left-color: var(--err);
    }

    .run-title {
      overflow-wrap: anywhere;
      font-weight: 700;
    }

    .run-meta {
      margin-top: 4px;
      color: var(--muted);
      font-size: 12px;
      overflow-wrap: anywhere;
    }

    .error-banner {
      display: none;
      margin-top: 12px;
      padding: 10px 12px;
      border: 1px solid #f2b8b5;
      border-radius: 6px;
      background: #fff4f2;
      color: var(--err);
      overflow-wrap: anywhere;
      font-weight: 600;
    }

    .error-banner[aria-hidden="false"] {
      display: block;
    }

    .warning-banner {
      border-color: color-mix(in srgb, var(--warn) 45%, transparent);
      background: color-mix(in srgb, var(--warn) 10%, white);
      color: #8a4b00;
    }

    .show-all {
      margin: 6px 0 0;
    }

    .msg .show-all,
    .banner .show-all {
      margin: 0 14px 10px;
    }

    .result-text {
      margin: 0;
      max-height: 260px;
    }

    .json-block {
      display: grid;
      gap: 6px;
      margin-top: 10px;
    }

    .json-label {
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    .event {
      border: 1px solid var(--border);
      border-left: 4px solid #98a2b3;
      border-radius: 6px;
      background: #ffffff;
      padding: 10px 12px;
    }

    .event[data-type="text"] {
      border-left-color: var(--accent);
    }

    .event[data-type="thinking"],
    .event[data-type="warning"] {
      border-left-color: var(--warn);
    }

    .event[data-type="tool_call"],
    .event[data-type="tool_result"],
    .event[data-type="agent_updated"],
    .event[data-type="subagent_started"],
    .event[data-type="subagent_ended"] {
      border-left-color: var(--tool);
    }

    .event[data-type="error"] {
      border-left-color: var(--err);
    }

    .event-head {
      display: flex;
      gap: 8px;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 6px;
    }

    .event-title {
      min-width: 0;
      overflow-wrap: anywhere;
      font-weight: 700;
    }

    .event-meta {
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
    }

    pre {
      overflow: auto;
      max-height: 320px;
      margin: 8px 0 0;
      padding: 10px;
      border-radius: 6px;
      background: var(--code);
      font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      white-space: pre-wrap;
    }

    details {
      margin-top: 8px;
    }

    summary {
      cursor: pointer;
      color: var(--accent);
      font-weight: 600;
    }

    .run-head {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px 16px;
    }

    .run-badges {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
    }

    .badge {
      padding: 2px 8px;
      border-radius: 4px;
      background: var(--panel-3);
      color: var(--muted);
      font-size: 10.5px;
      font-weight: 700;
      letter-spacing: .05em;
      text-transform: uppercase;
    }

    .badge-status.status-success {
      background: color-mix(in srgb, var(--ok) 15%, transparent);
      color: var(--ok);
    }

    .badge-status.status-failure,
    .badge-status.status-timeout,
    .badge-status.status-cancelled,
    .badge-error {
      background: color-mix(in srgb, var(--err) 15%, transparent);
      color: var(--err);
    }

    .badge-error {
      letter-spacing: 0;
      text-transform: none;
    }

    .badge-reason {
      background: color-mix(in srgb, var(--warn) 18%, transparent);
      color: var(--warn);
    }

    .badge-provider.provider-anthropic {
      background: color-mix(in srgb, #c96442 16%, transparent);
      color: #a4472a;
    }

    .badge-provider.provider-openai {
      background: color-mix(in srgb, #10a37f 16%, transparent);
      color: #0b7a5f;
    }

    .run-model {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 12.5px;
      font-weight: 600;
    }

    .run-ident {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      color: var(--faint);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 11px;
    }


    .metrics {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 12px;
    }

    .metric-group {
      display: flex;
      align-items: stretch;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--panel-2);
    }

    .metric-group-label {
      display: flex;
      align-items: center;
      padding: 0 10px;
      border-right: 1px solid var(--border);
      background: var(--panel-3);
      border-radius: 5px 0 0 5px;
      color: var(--faint);
      font-size: 9.5px;
      font-weight: 700;
      letter-spacing: .06em;
      text-transform: uppercase;
    }

    .metric-row {
      display: flex;
    }

    .metric {
      min-width: 62px;
      padding: 6px 11px;
      border-left: 1px solid var(--border);
    }

    .metric-row .metric:first-child {
      border-left: 0;
    }

    .metric-label {
      color: var(--faint);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .05em;
      text-transform: uppercase;
    }

    .run-filter {
      width: 100%;
      margin-bottom: 8px;
      padding: 5px 8px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--panel);
      color: var(--text);
      font: inherit;
      font-size: 12px;
    }

    .run-filter:focus-visible {
      border-color: var(--border-strong);
      outline: none;
    }

    .raw {
      max-height: none;
      margin: 0;
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--panel-2);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 11.5px;
      line-height: 1.5;
      white-space: pre;
      overflow: auto;
    }

    .raw-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .raw-meta {
      color: var(--faint);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 11px;
    }

    .system-prompt {
      margin: 0 0 12px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--panel-2);
    }

    .system-prompt > summary {
      padding: 8px 12px;
      color: var(--muted);
      cursor: pointer;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .06em;
      text-transform: uppercase;
    }

    .system-prompt .msg-body {
      border-top: 1px solid var(--border);
      color: var(--muted);
    }

    .side-list {
      display: grid;
      gap: 6px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .side-list li {
      overflow-wrap: anywhere;
      padding: 8px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: #fbfcfe;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 12px;
    }

    .side-list a {
      color: var(--accent);
      text-decoration: none;
    }

    .side-list a:hover {
      text-decoration: underline;
    }

    .empty {
      color: var(--muted);
    }

    @media (max-width: 820px) {
      .top {
        align-items: flex-start;
        flex-direction: column;
      }

      .controls {
        justify-content: flex-start;
      }

      .section-head {
        align-items: flex-start;
        flex-direction: column;
      }

      .grid {
        grid-template-columns: 1fr;
      }

      .viewer-layout {
        grid-template-columns: 1fr;
      }

      .results-sidebar {
        position: static;
        max-height: 44vh;
      }
    }

    :root {
      --bg: #dedee1;
      --panel: #ffffff;
      --panel-2: #f3f3f5;
      --panel-3: #eceef1;
      --text: #1f2127;
      --muted: #484c52;
      --faint: #6b7078;
      --border: #d6d8de;
      --border-strong: #c4c7cf;
      --accent: #0d99ff;
      --ok: #14ae5c;
      --warn: #d98324;
      --err: #e5484d;
      --tool: #8250df;
      --code: #f3f3f5;
      --cyan: #0d99ff;
      --orange: #e0820a;
      --shadow: 0 1px 2px rgba(20, 22, 30, .04), 0 2px 6px rgba(20, 22, 30, .06);
    }

    html,
    body {
      height: 100%;
    }

    body {
      display: flex;
      min-height: 100vh;
      flex-direction: column;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-size: 13px;
      line-height: 1.55;
    }

    header {
      flex: 0 0 auto;
      border-bottom-color: var(--border-strong);
      background: var(--panel);
      box-shadow: 0 1px 0 var(--border);
    }

    .wrap {
      width: 100%;
      max-width: none;
      margin: 0;
    }

    .top {
      min-height: 48px;
      padding: 9px 16px;
    }

    h1 {
      font-size: 14px;
      letter-spacing: 0;
    }

    h2 {
      color: var(--text);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .06em;
      text-transform: uppercase;
    }

    label.button,
    button.button {
      min-height: 28px;
      padding: 0 10px;
      border-color: var(--border);
      background: transparent;
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
    }

    label.button:hover,
    label.button:focus-within,
    button.button:hover,
    button.button:focus-visible {
      border-color: var(--border-strong);
      background: var(--panel-3);
      color: var(--text);
    }

    main {
      flex: 1 1 auto;
      min-height: 0;
      padding: 0;
      overflow: hidden;
    }

    .viewer-layout {
      height: 100%;
      /* Bound the row so the workspace scrolls within it. */
      grid-template-rows: minmax(0, 1fr);
      grid-template-columns: 300px minmax(0, 1fr);
      align-items: stretch;
      gap: 0;
    }

    body.results-collapsed .viewer-layout {
      grid-template-columns: minmax(0, 1fr);
    }

    .results-sidebar {
      position: relative;
      top: 0;
      height: 100%;
      max-height: none;
      min-height: 0;
      padding: 14px 12px;
      border-width: 0 1px 0 0;
      border-radius: 0;
      background: var(--panel-2);
    }

    .results-status {
      color: var(--faint);
      font-size: 12px;
    }

    .run-list {
      gap: 3px;
    }

    .run-button {
      min-height: 0;
      padding: 7px 10px;
      border-color: var(--border);
      border-left-width: 3px;
      background: var(--panel);
      color: var(--text);
      box-shadow: none;
      transition: background .12s, border-color .12s;
    }

    .run-button:hover,
    .run-button:focus-visible {
      border-color: var(--border-strong);
      background: var(--panel-3);
    }

    .run-button[aria-current="true"] {
      border-color: var(--border-strong);
      border-left-color: var(--accent);
      background: color-mix(in srgb, var(--accent) 8%, white);
    }

    .run-title {
      display: block;
      overflow: hidden;
      font-size: 12.5px;
      line-height: 1.45;
      white-space: nowrap;
    }

    .run-parent {
      display: block;
      overflow: hidden;
      color: var(--faint);
      font-size: 10.5px;
      font-weight: 400;
      text-overflow: ellipsis;
      direction: rtl;
      text-align: left;
    }

    .run-leaf {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .run-meta {
      color: var(--faint);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 10.5px;
    }

    .trace-workspace {
      min-height: 0;
      overflow: auto;
      padding: 14px 16px 24px;
    }


    section.view {
      padding: 0;
      border: 0;
      background: none;
      box-shadow: none;
    }

    .side-list {
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--panel);
    }

    section {
      border-color: var(--border-strong);
      background: var(--panel);
      box-shadow: var(--shadow);
    }

    .overview-panel {
      display: block;
    }

    #result {
      margin-top: 12px;
    }

    .summary {
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
    }

    .metric .label {
      color: var(--faint);
      font-size: 10.5px;
      font-weight: 600;
      letter-spacing: .04em;
      text-transform: uppercase;
    }

    .metric .value {
      color: var(--text);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 12px;
      font-weight: 500;
    }

    .status-success {
      color: var(--ok) !important;
    }

    .status-failure,
    .status-timeout,
    .status-cancelled {
      color: var(--err) !important;
    }

    .view-tabs {
      display: flex;
      gap: 0;
      margin: 0 0 12px;
    }

    .tab-btn {
      min-height: 30px;
      padding: 0 14px;
      border: 1px solid var(--border);
      border-right: 0;
      background: var(--panel);
      color: var(--muted);
      cursor: pointer;
      font: inherit;
      font-size: 12px;
    }

    .tab-btn:first-child {
      border-radius: 6px 0 0 6px;
    }

    .tab-btn:last-child {
      border-right: 1px solid var(--border);
      border-radius: 0 6px 6px 0;
    }

    .tab-btn:hover,
    .tab-btn:focus-visible,
    .tab-btn.active {
      background: var(--panel-3);
      color: var(--text);
      outline: none;
    }

    .tab-btn.active {
      border-color: var(--border-strong);
      color: var(--accent);
      box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent) 18%, transparent);
    }

    .view {
      display: none;
    }

    .view.active {
      display: block;
    }

    .conversation {
      display: grid;
      gap: 10px;
    }

    .msg,
    .tool-panel,
    .banner {
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--panel);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .msg-role,
    .tool-header,
    .banner-head {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 12px;
      border-bottom: 1px solid var(--border);
      background: var(--panel-2);
      color: var(--muted);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .07em;
      text-transform: uppercase;
    }

    .msg-role::before,
    .tool-header::before,
    .banner-head::before {
      content: "";
      width: 3px;
      height: 11px;
      border-radius: 2px;
      background: currentColor;
    }

    .msg-role.user {
      color: var(--accent);
    }

    .msg-role.assistant {
      color: var(--tool);
    }

    .msg-role.thinking {
      color: var(--warn);
    }

    .msg-body,
    .tool-body,
    .banner-body {
      padding: 12px 14px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .thinking-msg .msg-body {
      max-height: 220px;
      overflow: auto;
      color: var(--muted);
      background: var(--panel-2);
    }

    .tool-header {
      color: var(--cyan);
      cursor: pointer;
      text-transform: none;
      letter-spacing: 0;
      font-size: 12px;
    }

    .tool-name {
      color: var(--text);
      font-weight: 700;
    }

    .tool-summary {
      min-width: 0;
      overflow: hidden;
      color: var(--muted);
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .tool-state {
      margin-left: auto;
      color: var(--faint);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 10.5px;
      white-space: nowrap;
    }

    .tool-panel[data-error="true"] {
      border-color: color-mix(in srgb, var(--err) 35%, transparent);
    }

    .tool-panel[data-error="true"] .tool-header {
      color: var(--err);
    }

    .tool-section {
      display: grid;
      gap: 6px;
      margin-top: 10px;
    }

    .tool-section:first-child {
      margin-top: 0;
    }

    .tool-label {
      color: var(--faint);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .06em;
      text-transform: uppercase;
    }

    .banner[data-type="error"] .banner-head {
      color: var(--err);
    }

    .banner[data-type="warning"] .banner-head {
      color: var(--warn);
    }


    .trace-note {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 2px 2px 2px 0;
      color: var(--faint);
      font-size: 11.5px;
      font-style: italic;
    }

    .note-badge {
      padding: 1px 7px;
      border: 1px dashed var(--border-strong);
      border-radius: 999px;
      color: var(--muted);
      font-size: 9.5px;
      font-style: normal;
      font-weight: 700;
      letter-spacing: .06em;
      text-transform: uppercase;
    }

    .banner[data-type="session_info"],
    .banner[data-type="context_compacted"],
    .banner[data-type="usage"] {
      opacity: .9;
    }

    .event {
      border-color: var(--border);
      background: var(--panel);
      box-shadow: var(--shadow);
    }

    .event-head {
      align-items: center;
    }

    .event-title {
      color: var(--text);
    }

    .event-meta {
      color: var(--faint);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }

    pre {
      border: 1px solid var(--border);
      background: var(--code);
      color: var(--text);
    }

    summary {
      color: var(--accent);
    }

    .side-list li {
      border-color: var(--border);
      background: var(--panel);
      box-shadow: var(--shadow);
    }

    .side-list a {
      color: var(--accent);
    }

    .empty {
      color: var(--faint);
    }

    @media (max-width: 920px) {
      body {
        overflow: auto;
      }

      main {
        overflow: visible;
      }

      .viewer-layout,
      body.results-collapsed .viewer-layout {
        height: auto;
        grid-template-rows: auto;
        grid-template-columns: 1fr;
      }

      .results-sidebar {
        height: auto;
        max-height: 42vh;
        border-width: 0 0 1px;
      }

      .trace-workspace {
        overflow: visible;
        padding: 14px;
      }

      .overview-panel {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="wrap top">
      <h1>agent-sdk-wrapper Trace Viewer</h1>
      <div class="controls">
        <button id="toggleResults" class="button" type="button" aria-expanded="true" aria-controls="resultsSidebar">Hide Results</button>
        <label class="button"><input id="autoRefresh" type="checkbox" checked> Live</label>
        <button id="latestRun" class="button" type="button">Latest run</button>
        <label class="button" for="artifactFiles">Open Artifact Directory</label>
        <input id="artifactFiles" type="file" webkitdirectory directory multiple>
        <label class="button" for="looseFiles">Open Files</label>
        <input id="looseFiles" type="file" multiple>
      </div>
    </div>
  </header>

  <main class="wrap">
    <div class="viewer-layout">
      <aside id="resultsSidebar" class="results-sidebar" aria-label="Results">
        <div class="section-head">
          <h2>Results</h2>
          <button id="refreshResults" class="button" type="button">Refresh</button>
        </div>
        <input id="runFilter" class="run-filter" type="search" placeholder="Filter runs" aria-label="Filter runs">
        <div class="results-scroll">
          <div id="resultsStatus" class="results-status">Scanning /results/.</div>
          <ul id="runs" class="run-list"></ul>
        </div>
      </aside>

      <div class="trace-workspace">
        <section class="overview-panel">
          <div class="run-head">
            <div id="runBadges" class="run-badges"></div>
            <div id="runIdent" class="run-ident"></div>
          </div>
          <div id="summary" class="metrics" aria-label="Usage">
            <div class="empty">No trace loaded.</div>
          </div>
          <div id="load-error" class="error-banner" aria-hidden="true"></div>
          <div id="load-warning" class="error-banner warning-banner" aria-hidden="true"></div>
          <div id="result"></div>
        </section>

        <div class="view-tabs" role="tablist" aria-label="Trace views">
          <button class="tab-btn active" type="button" role="tab" aria-selected="true" data-view="conversation-view">Conversation</button>
          <button class="tab-btn" type="button" role="tab" aria-selected="false" data-view="timeline-view">Timeline</button>
          <button class="tab-btn" type="button" role="tab" aria-selected="false" data-view="events-view">Events</button>
          <button class="tab-btn" type="button" role="tab" aria-selected="false" data-view="files-view">Files</button>
          <button class="tab-btn" type="button" role="tab" aria-selected="false" data-view="raw-view">Raw</button>
        </div>

        <section id="conversation-view" class="view active" role="tabpanel">
          <div id="conversation" class="conversation">
            <div class="empty">No trace loaded.</div>
          </div>
        </section>

        <section id="timeline-view" class="view" role="tabpanel">
          <div id="timeline" class="timeline">
            <div class="empty">No trace loaded.</div>
          </div>
        </section>

        <section id="events-view" class="view" role="tabpanel">
          <div id="events" class="timeline">
            <div class="empty">No trace loaded.</div>
          </div>
        </section>

        <section id="files-view" class="view" role="tabpanel">
          <ul id="files" class="side-list"></ul>
        </section>

        <section id="raw-view" class="view" role="tabpanel">
          <div class="section-head">
            <h2>Raw</h2>
            <div class="raw-actions">
              <span id="rawMeta" class="raw-meta"></span>
              <button id="copyRaw" class="button" type="button">Copy</button>
            </div>
          </div>
          <pre id="raw" class="raw"><span class="empty">No trace loaded.</span></pre>
          <button id="rawMore" class="button show-all" type="button" hidden></button>
        </section>
      </div>
    </div>
  </main>

  <script>
    const artifactInput = document.querySelector("#artifactFiles");
    const looseFileInput = document.querySelector("#looseFiles");
    const toggleResultsButton = document.querySelector("#toggleResults");
    const resultsSidebarEl = document.querySelector("#resultsSidebar");
    const refreshResultsButton = document.querySelector("#refreshResults");
    const autoRefresh = document.querySelector("#autoRefresh");
    const latestRunButton = document.querySelector("#latestRun");
    const resultsStatusEl = document.querySelector("#resultsStatus");
    const runsEl = document.querySelector("#runs");
    const summaryEl = document.querySelector("#summary");
    const resultEl = document.querySelector("#result");
    const conversationEl = document.querySelector("#conversation");
    const timelineEl = document.querySelector("#timeline");
    const eventsEl = document.querySelector("#events");
    const filesEl = document.querySelector("#files");
    const workspaceEl = document.querySelector(".trace-workspace");
    const rawEl = document.querySelector("#raw");
    const rawMetaEl = document.querySelector("#rawMeta");
    const rawMoreButton = document.querySelector("#rawMore");
    const copyRawButton = document.querySelector("#copyRaw");
    const runBadgesEl = document.querySelector("#runBadges");
    const runIdentEl = document.querySelector("#runIdent");
    const runFilterEl = document.querySelector("#runFilter");
    const loadErrorEl = document.querySelector("#load-error");
    const loadWarningEl = document.querySelector("#load-warning");
    const tabButtons = [...document.querySelectorAll(".tab-btn")];
    const RESULTS_SIDEBAR_STORAGE_KEY = "agent-sdk-wrapper.trace-viewer.resultsCollapsed";
    // Longer values render truncated behind a "Show all" button.
    const OUTPUT_LIMIT = 2000;
    const MESSAGE_LIMIT = 50000;
    const RAW_LIMIT = 256 * 1024;
    const viewRenderers = {
      "conversation-view": renderConversation,
      "timeline-view": renderTimeline,
      "events-view": renderEvents,
      "files-view": renderFilesView,
      "raw-view": renderRaw,
    };
    let objectUrls = [];
    let discoveredRuns = [];
    let activeRunUrl = "";
    let followLatest = true;
    let discovering = false;
    let loadVersion = 0;
    let renderedRuns = "";
    // The trace on screen. Views render it lazily when their tab is active.
    let shown = null;
    let traceGeneration = 0;
    let activeView = "conversation-view";
    const staleViews = new Set();
    const renderedRows = new Map();
    let rawState = null;
    let rawExpanded = false;

    applyResultsSidebarState(loadResultsSidebarCollapsed());
    artifactInput.addEventListener("change", () => loadFiles([...artifactInput.files]));
    looseFileInput.addEventListener("change", () => loadFiles([...looseFileInput.files]));
    toggleResultsButton.addEventListener("click", () => {
      const collapsed = !document.body.classList.contains("results-collapsed");
      applyResultsSidebarState(collapsed);
      saveResultsSidebarCollapsed(collapsed);
    });
    refreshResultsButton.addEventListener("click", () => discoverResults(true));
    latestRunButton.addEventListener("click", () => {
      followLatest = true;
      autoRefresh.checked = true;
      discoverResults(true);
    });
    autoRefresh.addEventListener("change", () => {
      if (autoRefresh.checked) discoverResults();
    });
    copyRawButton.addEventListener("click", copyRawTrace);
    rawMoreButton.addEventListener("click", () => {
      rawExpanded = true;
      renderRaw();
    });
    runFilterEl.addEventListener("input", () => renderRuns(discoveredRuns));
    tabButtons.forEach((button) => {
      button.addEventListener("click", () => switchView(button.dataset.view));
    });

    discoverResults();
    if (window.location.protocol !== "file:") {
      setInterval(() => {
        if (autoRefresh.checked && !document.hidden) discoverResults();
      }, 2000);
    } else {
      autoRefresh.checked = false;
      autoRefresh.disabled = true;
      latestRunButton.disabled = true;
    }

    async function discoverResults(force = false) {
      if (window.location.protocol === "file:") {
        setResultsStatus("Run npm run trace-viewer for live traces.");
        renderRuns([]);
        return;
      }
      if (discovering) return;
      discovering = true;
      const selectionVersion = loadVersion;

      try {
        const previous = new Map(discoveredRuns.map((run) => [run.runUrl.href, run]));
        const { runs, found, scanned } = await findResultRuns();
        discoveredRuns = runs.map((run) => ({
          ...run, manifest: run.manifest || previous.get(run.runUrl.href)?.manifest,
        }));
        renderRuns(discoveredRuns);
        if (selectionVersion !== loadVersion) return;
        const count = discoveredRuns.length;
        const limit = scanned
          ? ` Scanned only the ${scanned} most recently modified directories.`
          : "";
        if (count) {
          setResultsStatus(found
            ? `Showing the ${count} most recently updated of ${found} runs.${limit}`
            : `Found ${count} result run(s).${limit}`);
          const selected = followLatest ? discoveredRuns[0]
            : discoveredRuns.find((run) => run.runUrl.href === activeRunUrl) || discoveredRuns[0];
          await loadRunFromUrl(selected, { refresh: !force });
        } else {
          setResultsStatus(`Waiting for traces.${limit}`);
        }
      } catch (error) {
        renderRuns([]);
        setResultsStatus(error instanceof Error ? error.message : String(error));
      } finally {
        discovering = false;
      }
    }

    async function findResultRuns() {
      const index = new URLSearchParams(window.location.search).get("index");
      const url = new URL(index || "/api/runs", window.location.href);
      // A link must not display another origin's trace under this page.
      if (url.origin !== window.location.origin) {
        throw new Error("The run index must come from this trace server");
      }
      const response = await fetchResponse(url, url.pathname);
      const entries = parseJson(await response.text(), url.pathname);
      if (!Array.isArray(entries)) throw new Error(`Could not parse ${url.pathname}: expected a list`);
      const runs = [];
      for (const entry of entries) {
        const traceUrl = sameOriginUrl(entry?.trace);
        const manifestUrl = sameOriginUrl(entry?.manifest);
        if ((entry?.trace && !traceUrl) || (entry?.manifest && !manifestUrl)) continue;
        if (!traceUrl && !manifestUrl) continue;
        runs.push({
          runUrl: traceUrl || manifestUrl,
          traceRel: traceUrl ? entry.trace : null,
          manifestUrl,
          label: typeof entry.label === "string" ? entry.label : "",
          updatedAt: typeof entry.updated_at === "string" ? entry.updated_at : "",
        });
      }
      // The server sends each count only when its limit shortened the list.
      const count = (name) => Number(response.headers.get(name)) || 0;
      return {
        runs: runs.sort(compareRuns),
        found: count("x-runs-found"),
        scanned: count("x-directories-scanned"),
      };
    }

    function sameOriginUrl(path) {
      if (typeof path !== "string" || !path) return null;
      try {
        const url = new URL(path, window.location.href);
        return url.origin === window.location.origin ? url : null;
      } catch {
        return null;
      }
    }

    function compareRuns(left, right) {
      const leftTime = String(left.updatedAt || left.manifest?.updated_at || left.label);
      const rightTime = String(right.updatedAt || right.manifest?.updated_at || right.label);
      return rightTime.localeCompare(leftTime);
    }

    function renderRuns(runs) {
      const query = (runFilterEl?.value || "").trim().toLowerCase();
      const content = JSON.stringify([activeRunUrl, query, runs, runs.map(runMeta)]);
      if (content === renderedRuns) return;
      renderedRuns = content;
      if (!runs.length) {
        runsEl.replaceChildren(emptyListItem("No result runs found."));
        return;
      }

      const visible = query
        ? runs.filter((run) => runSearchText(run).includes(query))
        : runs;
      if (!visible.length) {
        runsEl.replaceChildren(emptyListItem(`No runs match "${query}".`));
        return;
      }

      const items = visible.map((run) => {
        const li = document.createElement("li");
        const button = document.createElement("button");
        const status = run.manifest?.status || "unknown";
        button.type = "button";
        button.className = `run-button status-${status}`.trim();
        button.setAttribute("aria-current", run.runUrl.href === activeRunUrl ? "true" : "false");
        button.addEventListener("click", () => {
          followLatest = false;
          loadRunFromUrl(run);
        });

        const label = run.label || run.runUrl.pathname;
        const title = document.createElement("div");
        title.className = "run-title";
        // Show the leaf name; keep the full path in the tooltip.
        const segments = label.split("/").filter(Boolean);
        const leaf = segments.pop() || label;
        if (segments.length) {
          const parent = document.createElement("span");
          parent.className = "run-parent";
          parent.textContent = `${segments.join("/")}/`;
          title.append(parent);
        }
        const leafEl = document.createElement("span");
        leafEl.className = "run-leaf";
        leafEl.textContent = leaf;
        title.append(leafEl);
        button.title = label;

        const meta = document.createElement("div");
        meta.className = "run-meta";
        meta.textContent = runMeta(run);

        button.append(title, meta);
        li.append(button);
        return li;
      });
      runsEl.replaceChildren(...items);
    }

    function runMeta(run) {
      const manifest = run.manifest || {};
      const parts = [
        manifest.model || manifest.provider || "",
        relativeTime(run.updatedAt || manifest.updated_at),
      ].filter(Boolean);
      return parts.join(" · ");
    }

    function runSearchText(run) {
      const manifest = run.manifest || {};
      return [
        run.label || run.runUrl.pathname,
        manifest.status,
        manifest.provider,
        manifest.model,
      ]
        .filter(Boolean)
        .join(" ")
        .toLowerCase();
    }

    function relativeTime(iso) {
      if (!iso) return "";
      const then = Date.parse(iso);
      if (Number.isNaN(then)) return iso;
      const seconds = Math.round((Date.now() - then) / 1000);
      if (seconds < 60) return "just now";
      const units = [
        ["m", 60],
        ["h", 3600],
        ["d", 86400],
      ];
      let label = `${Math.round(seconds / 86400)}d ago`;
      for (const [suffix, size] of units) {
        if (seconds < size * 60 || suffix === "d") {
          label = `${Math.floor(seconds / size)}${suffix} ago`;
          break;
        }
      }
      return label;
    }

    async function loadRunFromUrl(run, { refresh = false } = {}) {
      const version = ++loadVersion;
      // A poll can race a click; only the run on screen refreshes in place.
      refresh = refresh && shown?.runUrl === run.runUrl.href;
      if (!refresh) {
        clearObjectUrls();
        setLoadError("");
      }
      activeRunUrl = run.runUrl.href;
      renderRuns(discoveredRuns);

      try {
        const manifest = run.manifestUrl
          ? objectJson(await fetchJson(run.manifestUrl, run.manifestUrl.pathname), run.manifestUrl.pathname)
          : null;
        const files = artifactFiles(manifest);
        const traceRel = files.trace || run.traceRel || "trace.jsonl";
        const traceUrl = runFileUrl(traceRel, run.runUrl);
        const resultUrl = files.result ? runFileUrl(files.result, run.runUrl) : null;
        const traceText = await fetchText(traceUrl, traceUrl.pathname);
        const result = resultUrl
          ? objectJson(await fetchJson(resultUrl, resultUrl.pathname), resultUrl.pathname)
          : null;
        if (version !== loadVersion) return;
        setLoadError("");
        const sidecars = JSON.stringify([manifest, result, traceRel]);
        if (refresh && traceText === shown.traceText && sidecars === shown.sidecars) return;
        const scroll = workspaceEl.scrollTop;
        const atBottom = workspaceEl.scrollHeight - workspaceEl.clientHeight - scroll < 40;

        showTrace({
          runUrl: run.runUrl.href,
          traceText,
          path: traceRel,
          manifest,
          result,
          sidecars,
          source: { runUrl: run.runUrl, traceRel },
        }, refresh ? shown : null);
        run.manifest = { ...traceMetadata(shown.trace), ...manifest };
        renderRuns(discoveredRuns);
        if (refresh) workspaceEl.scrollTop = atBottom ? workspaceEl.scrollHeight : scroll;
        else resetWorkspaceScroll();
      } catch (error) {
        if (version !== loadVersion) return;
        if (!refresh) renderEmpty();
        setLoadError(error instanceof Error ? error.message : String(error));
      }
    }

    function runFileUrl(path, runUrl) {
      const url = new URL(path, runUrl);
      if (url.origin !== runUrl.origin || !url.pathname.startsWith(new URL(".", runUrl).pathname)) {
        throw new Error("Artifact must be inside the run directory");
      }
      return url;
    }

    function artifactFiles(manifest) {
      const files = isObject(manifest?.files) ? manifest.files : {};
      return Object.fromEntries(
        Object.entries(files).filter(([, path]) => typeof path === "string" && path)
      );
    }

    async function fetchResponse(url, label) {
      const response = await fetch(url, { cache: "no-store" });
      if (!response.ok) {
        throw new Error(`Could not load ${label}: ${response.status} ${response.statusText}`);
      }
      return response;
    }

    async function fetchText(url, label) {
      return (await fetchResponse(url, label)).text();
    }

    async function fetchJson(url, label) {
      return parseJson(await fetchText(url, label), label);
    }

    function parseJson(text, label) {
      try {
        return JSON.parse(text);
      } catch (error) {
        throw new Error(`Could not parse ${label}: ${error.message}`);
      }
    }

    function objectJson(value, label) {
      if (value === null || isObject(value)) return value;
      throw new Error(`Could not parse ${label}: expected a JSON object`);
    }

    function isObject(value) {
      return value !== null && typeof value === "object" && !Array.isArray(value);
    }

    async function loadFiles(files) {
      const version = ++loadVersion;
      autoRefresh.checked = false;
      clearObjectUrls();
      setLoadError("");
      activeRunUrl = "";
      renderRuns(discoveredRuns);

      if (!files.length) {
        renderEmpty();
        return;
      }

      try {
        const byPath = new Map(files.map((file) => [relativeName(file), file]));
        const manifestFile = findFile(byPath, "manifest.json");
        const manifest = manifestFile ? await readJson(manifestFile) : null;
        const entries = artifactFiles(manifest);
        const traceFile = findFile(byPath, entries.trace || "trace.jsonl") || findTraceByExtension(byPath);
        const resultFile = findFile(byPath, entries.result || "result.json");
        const result = resultFile ? await readJson(resultFile) : null;
        const traceText = traceFile ? await traceFile.text() : "";
        if (version !== loadVersion) return;

        showTrace({
          runUrl: "",
          traceText,
          path: traceFile ? relativeName(traceFile) : "trace",
          manifest,
          result,
          sidecars: "",
          source: { byPath },
        }, null);
        resetWorkspaceScroll();
      } catch (error) {
        if (version !== loadVersion) return;
        renderEmpty();
        setLoadError(error instanceof Error ? error.message : String(error));
      }
    }

    function relativeName(file) {
      return file.webkitRelativePath || file.name;
    }

    function findFile(byPath, rel) {
      const normalized = rel.replace(/^\.?\//, "");
      if (byPath.has(normalized)) {
        return byPath.get(normalized);
      }
      for (const [path, file] of byPath) {
        if (path.endsWith(`/${normalized}`) || path === normalized) {
          return file;
        }
      }
      return null;
    }

    function findTraceByExtension(byPath) {
      // Accept named trace fixtures; exclude the native-event sidecar.
      let fallback = null;
      for (const [path, file] of byPath) {
        const name = path.split("/").pop() || path;
        if (!name.endsWith(".jsonl") || name === "provider-events.jsonl") {
          continue;
        }
        if (name.endsWith(".trace.jsonl")) {
          return file;
        }
        fallback = fallback || file;
      }
      return fallback;
    }

    async function readJson(file) {
      return objectJson(parseJson(await file.text(), relativeName(file)), relativeName(file));
    }

    // Parse JSONL, skipping lines that are not trace events. `line` continues
    // numbering when parsing text appended to an earlier parse.
    function parseTrace(text, path, line = 0) {
      const rows = [];
      const warnings = [];
      let lines = 0;
      for (let start = 0; start < text.length;) {
        const newline = text.indexOf("\n", start);
        const end = newline === -1 ? text.length : newline;
        const source = text.slice(start, end).trim();
        start = end + 1;
        line += 1;
        if (!source) continue;
        lines += 1;
        let row;
        try {
          row = JSON.parse(source);
        } catch (error) {
          // A copy of a live trace can end mid-line.
          warnings.push(newline === -1
            ? `${path} line ${line} is incomplete`
            : `${path} line ${line}: ${error.message}`);
          continue;
        }
        if (isObject(row) && isObject(row.event)) rows.push(row);
        else warnings.push(`${path} line ${line} is not a trace event`);
      }
      return { rows, warnings, lines, line };
    }

    function showTrace(next, previous) {
      // A growing trace only parses and renders its new lines.
      const grown = previous?.path === next.path &&
        previous.traceText.endsWith("\n") &&
        next.traceText.startsWith(previous.traceText);
      if (grown) {
        const added = next.traceText.slice(previous.traceText.length);
        const parsed = parseTrace(added, next.path, previous.line);
        for (const row of parsed.rows) previous.trace.push(row);
        shown = {
          ...previous,
          ...next,
          warnings: previous.warnings.concat(parsed.warnings),
          lines: previous.lines + parsed.lines,
          line: parsed.line,
          bytes: previous.bytes + byteLength(added),
        };
      } else {
        const parsed = parseTrace(next.traceText, next.path);
        rawExpanded = false;
        shown = {
          ...next,
          generation: ++traceGeneration,
          trace: parsed.rows,
          warnings: parsed.warnings,
          lines: parsed.lines,
          line: parsed.line,
          bytes: byteLength(next.traceText),
        };
      }
      renderSummary(shown.manifest, shown.result, shown.trace);
      renderResult(shown.result, shown.trace);
      setLoadWarning(shown.warnings);
      for (const view of Object.keys(viewRenderers)) staleViews.add(view);
      renderActiveView();
    }

    function renderActiveView() {
      if (shown && staleViews.delete(activeView)) viewRenderers[activeView]();
    }

    function byteLength(text) {
      return new Blob([text]).size;
    }

    function traceMetadata(trace) {
      const started = trace.findLast((row) => row.event?.type === "run_started");
      const current = started ? trace.filter((row) => row.run_id === started.run_id) : trace;
      const finished = current.findLast((row) => row.event?.type === "run_finished")?.event;
      const durations = trace.filter((row) => row.event?.type === "run_finished" && Number.isFinite(row.event.duration_ms));
      const reported = current.findLast((row) => row.event?.type === "session_info" && row.event.model);
      // Like RunResult, report the run's first error.
      const failed = finished?.status === "failure"
        ? current.find((row) => row.event?.type === "error")?.event
        : undefined;
      return {
        ...started?.event,
        // Prefer the model the runtime reported over the requested one.
        model: reported?.event.model || started?.event.model,
        run_id: started?.run_id,
        status: finished?.status || (started ? "running" : "unknown"),
        ended_reason: finished?.ended_reason,
        session_id: current.findLast((row) => row.event?.type === "session_info")?.event.id,
        duration_ms: durations.length ? durations.reduce((total, row) => total + row.event.duration_ms, 0) : undefined,
        error: failed?.message,
        error_type: failed?.error_type,
        updated_at: trace.at(-1)?.timestamp,
      };
    }

    function renderSummary(manifest, result, trace) {
      const metadata = { ...traceMetadata(trace), ...manifest, ...result };
      const status = metadata.status || "unknown";
      const stats = traceStats(trace, result);
      const provider = metadata.provider || "";
      const model = metadata.model || "";
      const endedReason = metadata.ended_reason || "";
      const error = errorText(metadata.error_type, metadata.error);

      const badges = [statusBadge(status)];
      if (endedReason && endedReason !== "success" && endedReason !== "unknown") {
        badges.push(badge(endedReason, "badge-reason"));
      }
      if (provider) badges.push(badge(provider, `badge-provider provider-${provider}`));
      if (model) {
        const modelEl = document.createElement("span");
        modelEl.className = "run-model";
        modelEl.textContent = model;
        badges.push(modelEl);
      }
      if (error) badges.push(badge(error, "badge-error"));
      runBadgesEl.replaceChildren(...badges);

      const identParts = [];
      const runId = textOf(metadata.run_id);
      if (runId) identParts.push(["run", runId.slice(0, 8), runId]);
      if (metadata.session_id) {
        identParts.push(["session", metadata.session_id, metadata.session_id]);
      }
      if (metadata.updated_at) {
        identParts.push(["", relativeTime(metadata.updated_at), metadata.updated_at]);
      }
      runIdentEl.replaceChildren(
        ...identParts.map(([label, value, full]) => {
          const node = document.createElement("span");
          node.className = "ident";
          node.title = full;
          node.textContent = label ? `${label} ${value}` : value;
          return node;
        })
      );

      const usage = stats.usage || {};
      const runtime = [
        ["Duration", formatDuration(metadata.duration_ms)],
        ["Events", String(trace.length)],
        ["Tools", String(stats.toolCalls)],
        ["Requests", usage.requests ? String(usage.requests) : ""],
      ];
      const spend = [
        ["Input", formatCount(usage.input_tokens)],
        // Hide optional counters when zero.
        ["Cached", usage.cache_read_tokens ? formatCount(usage.cache_read_tokens) : ""],
        ["Output", formatCount(usage.output_tokens)],
        [
          "Reasoning",
          usage.reasoning_output_tokens ? formatCount(usage.reasoning_output_tokens) : "",
        ],
        ["Cost", stats.costLabel],
      ];
      summaryEl.replaceChildren(
        metricGroup("Runtime", runtime),
        metricGroup("Usage", spend)
      );
    }

    function traceStats(trace, result) {
      let toolCalls = 0;
      let usage = result?.usage || null;
      let cost = typeof result?.cost_usd === "number" ? result.cost_usd : null;
      let eventCost = null;
      const totals = {};
      let sawUsageEvent = false;

      for (const envelope of trace) {
        const event = envelope.event || {};
        if (event.type === "tool_call") toolCalls += 1;
        if (event.type !== "usage") continue;
        sawUsageEvent = true;
        for (const [key, value] of Object.entries(isObject(event.usage) ? event.usage : {})) {
          if (typeof value === "number") totals[key] = (totals[key] || 0) + value;
        }
        if (typeof event.cost_usd === "number") eventCost = (eventCost || 0) + event.cost_usd;
      }
      // Prefer result.json totals; otherwise sum trace usage.
      if (!usage && sawUsageEvent) usage = totals;
      if (cost === null) cost = eventCost;

      return {
        toolCalls,
        usage,
        // Use a dash when cost is unavailable.
        costLabel: cost === null ? "—" : formatCost(cost),
      };
    }

    function formatCount(value) {
      if (!value) return value === 0 ? "0" : "—";
      return value.toLocaleString();
    }

    function formatCost(cost) {
      if (cost === 0) return "$0";
      // Keep sub-cent precision.
      return cost < 1 ? `$${cost.toFixed(4)}` : `$${cost.toFixed(2)}`;
    }

    function statusBadge(status) {
      return badge(status, `badge-status status-${status}`);
    }

    function badge(text, cls) {
      const node = document.createElement("span");
      node.className = `badge ${cls}`.trim();
      node.textContent = text;
      return node;
    }

    function metricGroup(title, cells) {
      const group = document.createElement("div");
      group.className = "metric-group";
      const titleEl = document.createElement("div");
      titleEl.className = "metric-group-label";
      titleEl.textContent = title;
      const row = document.createElement("div");
      row.className = "metric-row";
      row.append(
        ...cells.filter(([, value]) => value !== "").map(([l, v]) => metricCell(l, v))
      );
      group.append(titleEl, row);
      return group;
    }

    function metricCell(label, value) {
      const cell = document.createElement("div");
      cell.className = "metric";
      const valueEl = document.createElement("div");
      valueEl.className = "metric-value";
      valueEl.textContent = value || "—";
      const labelEl = document.createElement("div");
      labelEl.className = "metric-label";
      labelEl.textContent = label;
      cell.append(valueEl, labelEl);
      return cell;
    }

    function renderResult(result, trace) {
      // Use result.json when the trace has no final output.
      if (!result || trace.length) {
        resultEl.replaceChildren();
        return;
      }

      const nodes = [];
      if (result.final_text) {
        nodes.push(capped("pre", "result-text", textOf(result.final_text), MESSAGE_LIMIT));
      } else if (result.error) {
        const error = document.createElement("div");
        error.className = "status-failure";
        error.textContent = errorText(result.error_type, result.error);
        nodes.push(error);
      } else {
        nodes.push(emptyNode("Result has no final text."));
      }

      if (result.structured_output !== null && result.structured_output !== undefined) {
        nodes.push(jsonDetails("Structured Output", result.structured_output));
      }

      resultEl.replaceChildren(...nodes);
    }

    function renderConversation() {
      const items = buildConversation(shown.trace, shown.generation);
      if (!items.length) {
        conversationEl.replaceChildren(emptyNode("No trace loaded."));
        return;
      }
      reconcile(conversationEl, items, renderConversationItem);
    }

    // Keep nodes whose key is unchanged so polling appends instead of rebuilding.
    function reconcile(container, items, render) {
      const existing = new Map();
      for (let node = container.firstElementChild; node; node = node.nextElementSibling) {
        if (node.dataset.key) existing.set(node.dataset.key, node);
      }
      let cursor = container.firstElementChild;
      for (const item of items) {
        let node = existing.get(item.key);
        if (node) {
          existing.delete(item.key);
        } else {
          node = render(item);
          node.dataset.key = item.key;
        }
        if (node === cursor) cursor = cursor.nextElementSibling;
        else container.insertBefore(node, cursor);
      }
      while (cursor) {
        const next = cursor.nextElementSibling;
        cursor.remove();
        cursor = next;
      }
    }

    // Item keys change whenever an item's content changes.
    function buildConversation(trace, generation = 0) {
      const items = [];
      // Tool ids are only unique within a run.
      const pendingCalls = new Map();
      const callKey = (envelope, id) => JSON.stringify([envelope.run_id ?? null, id]);
      let currentMessage = null;
      let systemPrompt = null;

      function flushMessage() {
        if (currentMessage && currentMessage.text.trim()) {
          currentMessage.key = `${generation}:${currentMessage.first}-${currentMessage.last}`;
          items.push(currentMessage);
        }
        currentMessage = null;
      }

      trace.forEach((envelope, index) => {
        const event = envelope.event || {};
        const key = `${generation}:${index}`;
        const text = textOf(event.text);
        if (event.type === "thinking" && !text.trim()) {
          flushMessage();
          items.push({ kind: "note", key, label: "Thinking", text: hiddenThinking(event) });
          return;
        }
        if (event.type === "text" || event.type === "thinking") {
          const role = event.type === "thinking" ? "thinking" : "assistant";
          if (!currentMessage || currentMessage.role !== role) {
            flushMessage();
            currentMessage = { kind: "message", role, text: "", first: index };
          }
          currentMessage.text += text;
          currentMessage.last = index;
          return;
        }

        flushMessage();
        if (event.type === "run_started") {
          const system = textOf(event.system_prompt);
          if (system && system !== systemPrompt) {
            items.push({ kind: "system", key: `${key}:system`, text: system });
          }
          systemPrompt = system || systemPrompt;
          const prompt = textOf(event.prompt);
          if (prompt) items.push({ kind: "message", key: `${key}:prompt`, role: "user", text: prompt });
        } else if (event.type === "tool_call") {
          const item = { kind: "tool", key, call: event, result: null };
          items.push(item);
          if (event.id != null) {
            const calls = pendingCalls.get(callKey(envelope, event.id)) || [];
            calls.push(item);
            pendingCalls.set(callKey(envelope, event.id), calls);
          }
        } else if (event.type === "tool_result") {
          const call = event.id != null ? pendingCalls.get(callKey(envelope, event.id))?.shift() : null;
          if (call) {
            call.result = event;
            call.key += `:${index}`;
          } else {
            items.push({ kind: "tool", key, call: null, result: event });
          }
        } else if (event.type === "session_info") {
          items.push({
            kind: "banner",
            key,
            type: event.type,
            title: "Session",
            body: [
              event.id ? `id: ${textOf(event.id)}` : null,
              event.model ? `model: ${textOf(event.model)}` : null,
            ].filter(Boolean).join(" · "),
          });
        } else if (event.type === "run_finished") {
          items.push({
            kind: "banner",
            key,
            type: event.type,
            title: `Run finished: ${textOf(event.status) || "unknown"}`,
            body: [
              event.ended_reason && event.ended_reason !== event.status
                ? `reason: ${textOf(event.ended_reason)}`
                : null,
              formatDuration(event.duration_ms),
            ].filter(Boolean).join(" · "),
          });
        } else if (event.type === "warning" || event.type === "error") {
          items.push({
            kind: "banner",
            key,
            type: event.type,
            title: event.error_type ? `error: ${textOf(event.error_type)}` : event.type,
            body: textOf(event.message),
          });
        } else if (event.type === "agent_updated") {
          items.push({
            kind: "banner",
            key,
            type: event.type,
            title: "Agent",
            body: textOf(event.name),
          });
        } else if (event.type === "subagent_started") {
          items.push({
            kind: "banner",
            key,
            type: event.type,
            title: `Subagent started${event.name ? ` (${textOf(event.name)})` : ""}`,
            body: textOf(event.description || event.task_id),
          });
        } else if (event.type === "subagent_ended") {
          items.push({
            kind: "banner",
            key,
            type: event.type,
            title: `Subagent ${textOf(event.status) || "ended"}`,
            body: textOf(event.summary || event.task_id),
          });
        } else if (event.type === "context_compacted") {
          items.push({
            kind: "banner",
            key,
            type: event.type,
            title: "Context compacted",
            body: [
              `trigger: ${textOf(event.trigger) || "unknown"}`,
              event.pre_tokens == null
                ? null
                : `pre-compaction tokens: ${event.pre_tokens.toLocaleString()}`,
            ]
              .filter(Boolean)
              .join(", "),
          });
        } else if (event.type === "structured_output") {
          items.push({
            kind: "banner",
            key,
            type: event.type,
            title: "Structured Output",
            body: stringifyBody(event.value),
          });
        } else if (event.type === "usage") {
          items.push({
            kind: "banner",
            key,
            type: event.type,
            title: "Usage",
            body: stringifyPretty(event.usage || event),
          });
        }
      });
      flushMessage();
      return items;
    }

    function renderConversationItem(item) {
      if (item.kind === "note") {
        const node = document.createElement("div");
        node.className = "trace-note";
        const label = document.createElement("span");
        label.className = "note-badge";
        label.textContent = item.label;
        const text = document.createElement("span");
        text.textContent = item.text;
        node.append(label, text);
        return node;
      }
      if (item.kind === "system") {
        const node = document.createElement("details");
        node.className = "system-prompt";
        const summary = document.createElement("summary");
        summary.textContent = "System prompt";
        node.append(summary, capped("div", "msg-body", item.text, MESSAGE_LIMIT));
        return node;
      }
      if (item.kind === "message") {
        const node = document.createElement("article");
        node.className = `msg ${item.role}-msg`;
        const role = document.createElement("div");
        role.className = `msg-role ${item.role}`;
        role.textContent = item.role;
        node.append(role, capped("div", "msg-body", item.text, MESSAGE_LIMIT));
        return node;
      }

      if (item.kind === "tool") {
        return renderToolPanel(item);
      }

      const node = document.createElement("article");
      node.className = "banner";
      node.dataset.type = item.type || "";
      const head = document.createElement("div");
      head.className = "banner-head";
      head.textContent = item.title || "Event";
      node.append(head, capped("div", "banner-body", item.body || "", OUTPUT_LIMIT));
      return node;
    }

    function renderToolPanel(item) {
      const { call, result } = item;
      const node = document.createElement("article");
      node.className = "tool-panel";
      node.dataset.error = String(Boolean(result?.is_error));

      const head = document.createElement("div");
      head.className = "tool-header";
      const name = document.createElement("span");
      name.className = "tool-name";
      name.textContent = textOf(call?.name ?? result?.name) || "tool";
      const summary = document.createElement("span");
      summary.className = "tool-summary";
      summary.textContent = call ? toolSummary(call) : "no matching tool call";
      const state = document.createElement("span");
      state.className = "tool-state";
      state.textContent = result ? (result.is_error ? "error" : "done") : "pending";
      head.append(name, summary, state);

      const body = document.createElement("div");
      body.className = "tool-body";
      if (call) body.append(toolSection("Input", call.input));
      if (result) {
        body.append(toolSection(result.is_error ? "Error" : "Output", result.output));
      }

      node.append(head, body);
      return node;
    }

    function toolSection(label, value) {
      const section = document.createElement("div");
      section.className = "tool-section";
      const labelEl = document.createElement("div");
      labelEl.className = "tool-label";
      labelEl.textContent = label;
      section.append(labelEl, capped("pre", "", stringifyPretty(value), OUTPUT_LIMIT));
      return section;
    }

    function toolSummary(call) {
      const input = call.input || {};
      const candidate =
        input.path ||
        input.file_path ||
        input.command ||
        input.cmd ||
        input.query ||
        input.pattern ||
        input.description ||
        input.prompt ||
        "";
      if (!candidate) return "";
      const text = typeof candidate === "string" ? candidate : JSON.stringify(candidate);
      return text.length > 140 ? `${text.slice(0, 137)}...` : text;
    }

    function renderTimeline() {
      renderRows(timelineEl, renderEvent);
    }

    function renderEvents() {
      renderRows(eventsEl, renderRawEvent);
    }

    function renderRows(container, render) {
      const { trace } = shown;
      if (!trace.length) {
        container.replaceChildren(emptyNode("No trace loaded."));
        renderedRows.delete(container);
        return;
      }
      // Rows only append within one trace generation.
      let rendered = renderedRows.get(container);
      if (rendered?.trace !== trace) {
        container.replaceChildren();
        rendered = { trace, count: 0 };
        renderedRows.set(container, rendered);
      }
      const fragment = document.createDocumentFragment();
      for (let index = rendered.count; index < trace.length; index++) {
        fragment.append(render(trace[index]));
      }
      container.append(fragment);
      rendered.count = trace.length;
    }

    function renderRawEvent(envelope) {
      const event = envelope.event || {};
      const node = document.createElement("article");
      node.className = "event";
      node.dataset.type = textOf(event.type);
      const head = document.createElement("div");
      head.className = "event-head";
      const title = document.createElement("div");
      title.className = "event-title";
      title.textContent = eventTitle(event);
      const meta = document.createElement("div");
      meta.className = "event-meta";
      meta.textContent = `#${envelope.sequence} ${shortTime(envelope.timestamp)}`;
      head.append(title, meta);
      node.append(head, capped("pre", "", JSON.stringify(envelope, null, 2), OUTPUT_LIMIT));
      return node;
    }

    function renderEvent(envelope) {
      const event = envelope.event || {};
      const node = document.createElement("article");
      node.className = "event";
      node.dataset.type = textOf(event.type);

      const head = document.createElement("div");
      head.className = "event-head";
      const title = document.createElement("div");
      title.className = "event-title";
      title.textContent = eventTitle(event);
      const meta = document.createElement("div");
      meta.className = "event-meta";
      meta.textContent = `#${envelope.sequence} ${shortTime(envelope.timestamp)}`;
      head.append(title, meta);
      node.append(head);

      const body = eventBody(event);
      if (body) node.append(capped("div", "", body, OUTPUT_LIMIT));

      const details = document.createElement("details");
      const summary = document.createElement("summary");
      summary.textContent = "JSON";
      details.append(summary);
      // Serialize on first open; most rows stay closed.
      let filled = false;
      details.addEventListener("toggle", () => {
        if (!details.open || filled) return;
        filled = true;
        details.append(capped("pre", "", JSON.stringify(envelope, null, 2), OUTPUT_LIMIT));
      });
      node.append(details);
      return node;
    }

    function eventTitle(event) {
      if (event.type === "tool_call") {
        return `tool_call ${textOf(event.name)}`.trim();
      }
      if (event.type === "tool_result") {
        return `tool_result${event.is_error ? " error" : ""}`;
      }
      if (event.type === "run_finished") {
        return `run_finished ${textOf(event.status)}`.trim();
      }
      if (event.type === "usage") {
        return "usage";
      }
      if (event.type === "session_info") {
        return `session_info ${textOf(event.id)}`.trim();
      }
      if (event.type === "error") {
        return `error ${textOf(event.error_type)}`.trim();
      }
      return textOf(event.type) || "event";
    }

    function eventBody(event) {
      if (event.type === "thinking" && !textOf(event.text).trim()) return hiddenThinking(event);
      if (event.type === "agent_updated") return textOf(event.name);
      if (event.type === "subagent_started") return textOf(event.description || event.task_id);
      if (event.type === "subagent_ended") return textOf(event.summary || event.task_id);
      if (event.type === "context_compacted") return `trigger: ${textOf(event.trigger) || "unknown"}`;
      if (event.type === "run_finished") {
        return [
          event.ended_reason && event.ended_reason !== event.status
            ? `reason: ${textOf(event.ended_reason)}`
            : null,
          formatDuration(event.duration_ms),
        ].filter(Boolean).join(" · ");
      }
      if (event.text) return textOf(event.text);
      if (event.message) return textOf(event.message);
      if (event.prompt) return textOf(event.prompt);
      if (event.output !== undefined) return stringifyBody(event.output);
      if (event.value !== undefined) return stringifyBody(event.value);
      if (isObject(event.usage)) {
        return `${event.usage.total_tokens ?? "-"} tokens`;
      }
      if (event.model) return `model: ${textOf(event.model)}`;
      if (event.input) return stringifyBody(event.input);
      return "";
    }

    function renderFilesView() {
      if (shown.source.byPath) renderFiles(shown.manifest, shown.source.byPath);
      else renderServerFiles(shown.manifest, shown.source.runUrl, shown.source.traceRel);
    }

    function renderFiles(manifest, byPath) {
      const names = new Set();
      for (const path of byPath.keys()) names.add(path);
      for (const rel of Object.values(artifactFiles(manifest))) names.add(rel);
      const items = [...names].sort().map((name) => {
        const li = document.createElement("li");
        const file = findFile(byPath, name);
        if (file) {
          // A plain-text blob cannot run an .html artifact in the viewer's origin.
          const url = URL.createObjectURL(new Blob([file], { type: "text/plain;charset=utf-8" }));
          objectUrls.push(url);
          const link = document.createElement("a");
          link.href = url;
          link.textContent = name;
          link.download = name.split("/").pop() || name;
          li.append(link);
        } else {
          li.textContent = name;
        }
        return li;
      });
      filesEl.replaceChildren(...items.length ? items : [emptyListItem("No files loaded.")]);
    }

    function renderServerFiles(manifest, runUrl, traceRel) {
      const names = new Set(manifest ? ["manifest.json"] : []);
      if (traceRel) names.add(traceRel);
      for (const rel of Object.values(artifactFiles(manifest))) names.add(rel);

      const items = [...names].sort().map((name) => {
        const li = document.createElement("li");
        let href;
        try {
          href = runFileUrl(name, runUrl).href;
        } catch {
          li.textContent = `${name} (outside the run directory)`;
          return li;
        }
        const link = document.createElement("a");
        link.href = href;
        link.textContent = name;
        link.target = "_blank";
        link.rel = "noreferrer";
        li.append(link);
        return li;
      });
      filesEl.replaceChildren(...items.length ? items : [emptyListItem("No files loaded.")]);
    }

    function formatDuration(value) {
      if (!Number.isFinite(value)) return "";
      if (value < 1000) return `${value} ms`;
      if (value < 60000) return `${(value / 1000).toFixed(1)} s`;
      const minutes = Math.floor(value / 60000);
      return `${minutes}m ${Math.round((value % 60000) / 1000)}s`;
    }

    function shortTime(value) {
      if (!value) return "";
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return value;
      return date.toLocaleTimeString();
    }

    function textOf(value) {
      if (typeof value === "string") return value;
      return value === undefined || value === null ? "" : JSON.stringify(value);
    }

    function errorText(type, message) {
      return [textOf(type), textOf(message)].filter(Boolean).join(": ");
    }

    function hiddenThinking(event) {
      return event.redacted_bytes
        ? `not exposed — ${textOf(event.redacted_bytes)} bytes redacted`
        : "not exposed by the provider";
    }

    function stringifyBody(value) {
      return typeof value === "string" ? value : textOf(value);
    }

    function stringifyPretty(value) {
      if (value === undefined || value === null || value === "") return "-";
      if (typeof value === "string") {
        const trimmed = value.trim();
        if (
          (trimmed.startsWith("{") && trimmed.endsWith("}")) ||
          (trimmed.startsWith("[") && trimmed.endsWith("]"))
        ) {
          try {
            return JSON.stringify(JSON.parse(trimmed), null, 2);
          } catch {
            return value;
          }
        }
        return value;
      }
      return JSON.stringify(value, null, 2);
    }

    // Render text in `tag`, truncated to `limit` characters until expanded.
    function capped(tag, className, text, limit) {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text.length <= limit) {
        node.textContent = text;
        return node;
      }
      node.textContent = text.slice(0, limit);
      const more = document.createElement("button");
      more.type = "button";
      more.className = "button show-all";
      more.textContent = `Show all ${text.length.toLocaleString()} characters`;
      more.addEventListener("click", () => {
        node.textContent = text;
        more.remove();
      });
      const wrap = document.createElement("div");
      wrap.className = "capped";
      wrap.append(node, more);
      return wrap;
    }

    function jsonDetails(label, value) {
      const details = document.createElement("details");
      const summary = document.createElement("summary");
      summary.textContent = label;
      details.append(summary, capped("pre", "", JSON.stringify(value, null, 2), OUTPUT_LIMIT));
      return details;
    }

    function switchView(viewId) {
      if (!viewRenderers[viewId]) return;
      activeView = viewId;
      for (const button of tabButtons) {
        const active = button.dataset.view === viewId;
        button.classList.toggle("active", active);
        button.setAttribute("aria-selected", String(active));
      }
      for (const view of document.querySelectorAll(".view")) {
        view.classList.toggle("active", view.id === viewId);
      }
      renderActiveView();
      // Reset the shared scroll position when switching tabs.
      resetWorkspaceScroll();
    }

    function resetWorkspaceScroll() {
      if (workspaceEl) {
        workspaceEl.scrollTop = 0;
      }
    }

    function emptyNode(text, tag = "div") {
      const node = document.createElement(tag);
      node.className = "empty";
      node.textContent = text;
      return node;
    }

    function emptyListItem(text) {
      return emptyNode(text, "li");
    }

    function setLoadError(message) {
      loadErrorEl.textContent = message;
      loadErrorEl.setAttribute("aria-hidden", message ? "false" : "true");
    }

    function setLoadWarning(warnings) {
      const listed = warnings.slice(0, 3).join("; ");
      const more = warnings.length > 3 ? `; ${warnings.length - 3} more` : "";
      const message = warnings.length
        ? `Skipped ${warnings.length} invalid trace line${warnings.length === 1 ? "" : "s"}: ${listed}${more}.`
        : "";
      loadWarningEl.textContent = message;
      loadWarningEl.setAttribute("aria-hidden", message ? "false" : "true");
    }

    function setResultsStatus(message) {
      resultsStatusEl.textContent = message;
    }

    function loadResultsSidebarCollapsed() {
      try {
        return localStorage.getItem(RESULTS_SIDEBAR_STORAGE_KEY) === "true";
      } catch {
        return false;
      }
    }

    function saveResultsSidebarCollapsed(collapsed) {
      try {
        localStorage.setItem(RESULTS_SIDEBAR_STORAGE_KEY, String(collapsed));
      } catch {
        // Ignore storage failures; the toggle should still work for this page load.
      }
    }

    function applyResultsSidebarState(collapsed) {
      document.body.classList.toggle("results-collapsed", collapsed);
      resultsSidebarEl.setAttribute("aria-hidden", String(collapsed));
      toggleResultsButton.setAttribute("aria-expanded", String(!collapsed));
      toggleResultsButton.textContent = collapsed ? "Show Results" : "Hide Results";
    }

    function renderRaw() {
      // Show the loaded trace text without re-serializing it.
      const text = shown?.traceText || "";
      if (!text) {
        rawEl.replaceChildren(emptyNode("No trace loaded.", "span"));
        rawMetaEl.textContent = "";
        rawMoreButton.hidden = true;
        rawState = null;
        return;
      }
      const visible = rawExpanded ? text.length : Math.min(text.length, RAW_LIMIT);
      if (rawState?.generation === shown.generation && rawState.visible <= visible) {
        if (visible > rawState.visible) rawEl.append(text.slice(rawState.visible, visible));
      } else {
        rawEl.textContent = text.slice(0, visible);
      }
      rawState = { generation: shown.generation, visible };
      rawMoreButton.hidden = visible === text.length;
      rawMoreButton.textContent = `Show all ${formatBytes(shown.bytes)}`;
      rawMetaEl.textContent = `${shown.lines.toLocaleString()} lines · ${formatBytes(shown.bytes)}`;
    }

    function formatBytes(bytes) {
      if (bytes < 1024) return `${bytes} B`;
      if (bytes < 1024 * 1024) return `${(bytes / 1024).toFixed(1)} KB`;
      return `${(bytes / (1024 * 1024)).toFixed(1)} MB`;
    }

    async function copyRawTrace() {
      if (!shown?.traceText) return;
      try {
        await navigator.clipboard.writeText(shown.traceText);
        flashCopyLabel("Copied");
      } catch {
        flashCopyLabel("Copy failed");
      }
    }

    function flashCopyLabel(text) {
      copyRawButton.textContent = text;
      setTimeout(() => {
        copyRawButton.textContent = "Copy";
      }, 1200);
    }

    function renderEmpty() {
      shown = null;
      staleViews.clear();
      renderedRows.clear();
      summaryEl.replaceChildren(emptyNode("No trace loaded."));
      runBadgesEl.replaceChildren();
      runIdentEl.replaceChildren();
      resultEl.replaceChildren();
      setLoadWarning([]);
      for (const view of [conversationEl, timelineEl, eventsEl]) {
        view.replaceChildren(emptyNode("No trace loaded."));
      }
      filesEl.replaceChildren(emptyListItem("No files loaded."));
      renderRaw();
    }

    function clearObjectUrls() {
      for (const url of objectUrls) URL.revokeObjectURL(url);
      objectUrls = [];
    }
  </script>
</body>
</html>
